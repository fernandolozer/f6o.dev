---
layout: default
nav_active: blog
---
<article class="container post">
    <header class="post-header">
        <p class="mono muted"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
        <h1>{{ page.title }}</h1>
        {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
    </header>
    <div class="prose">
        {{ content }}
    </div>
    <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
</article>
