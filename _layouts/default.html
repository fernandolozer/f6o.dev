<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{% if page.title and page.title != 'Home' %}{{ page.title }} - {% endif %}f6o.dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body>
    <header class="site-header container">
        <a href="{{ '/' | relative_url }}" class="logo">f6o<span>.</span>dev</a>
        <nav class="nav" aria-label="Main">
            <a href="{{ '/#projects' | relative_url }}">Projects</a>
            <a href="{{ '/blog/' | relative_url }}"{% if page.nav_active == 'blog' %} aria-current="page"{% endif %}>Writing</a>
            <a href="{{ '/about/' | relative_url }}"{% if page.nav_active == 'about' %} aria-current="page"{% endif %}>About</a>
            <a href="https://github.com/fernandolozer">GitHub</a>
        </nav>
    </header>

    <main>
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="container">
            <span>&copy; {{ site.time | date: '%Y' }} f6o.dev</span>
            <span class="mono">built with Jekyll + Markdown</span>
        </div>
    </footer>
</body>
</html>
